<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Ameen | Photo Gallery</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="gallery.css">
</head>
<body>

    <div class="page-container">
        <!-- Navigation Header -->
        <header class="navbar">
            <div class="logo">
                <a href="index.html">Baby Ameen</a>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="gallery.html" class="active">Gallery</a></li>
                </ul>
            </nav>
        </header>

        <!-- Gallery Hero / Intro -->
        <header class="gallery-hero">
            <span class="subheading">Captured Moments</span>
            <h1 class="main-heading">Photo Gallery</h1>
            <div class="divider"></div>
            <p class="tagline">Exploring milestones, joy, and precious early memories.</p>

            <!-- Category Filter Buttons -->
            <div class="filter-bar">
                <button class="filter-btn active" onclick="filterGallery('all')">All</button>
                <button class="filter-btn" onclick="filterGallery('curated')">Curated</button>
                <button class="filter-btn" onclick="filterGallery('portraits')">Portraits</button>
                <button class="filter-btn" onclick="filterGallery('decor')">Decor</button>
                <button class="filter-btn" onclick="filterGallery('celebration')">Celebration</button>
            </div>
        </header>

        <!-- Gallery Grid Container -->
        <main class="gallery-container">
            <div class="masonry-grid" id="galleryGrid">
                <!-- Dynamically populated by JavaScript -->
            </div>

            <!-- Discover More Moments Button -->
            <div class="load-more-wrapper">
                <button id="loadMoreBtn" class="btn-load-more" onclick="showNextBatch()">Discover More Moments</button>
            </div>
        </main>

        <!-- Lightbox Modal -->
        <div class="lightbox" id="lightbox" onclick="closeLightbox()">
            <span class="close-btn">&times;</span>
            <img class="lightbox-content" id="lightboxImg" alt="Full screen preview">
        </div>

        <!-- Footer -->
        <footer class="site-footer">
            <p class="copyright">&copy; 2026 Baby Ameen's Journey. All Rights Reserved.</p>
        </footer>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const startNum = 2516;
        const endNum = 2565;
        const itemsPerPage = 9;
        let currentCategory = 'all';

        // Categorization sequence definitions
        const curatedPhotos = [2516, 2518, 2520, 2525, 2530, 2535, 2540, 2545, 2550, 2555, 2560, 2565];
        const decorPhotos = [2521, 2522, 2523, 2524, 2526, 2527];
        const celebrationPhotos = [2528, 2529, 2531, 2532, 2533, 2534];

        const galleryGrid = document.getElementById('galleryGrid');

        // Dynamically build gallery grid items
        for (let i = startNum; i <= endNum; i++) {
            const imgName = `IMG_${i}.jpg`; 
            const imgPath = `images/${imgName}`;
            
            let categories = [];
            if (curatedPhotos.includes(i)) categories.push('curated');
            if (decorPhotos.includes(i)) {
                categories.push('decor');
            } else if (celebrationPhotos.includes(i)) {
                categories.push('celebration');
            } else {
                categories.push('portraits');
            }

            const itemDiv = document.createElement('div');
            itemDiv.className = `gallery-item ${categories.join(' ')}`;
            itemDiv.style.display = 'none'; // Hidden initially for pagination
            itemDiv.onclick = () => openLightbox(imgPath);

            itemDiv.innerHTML = `
                <img src="${imgPath}" alt="Baby Ameen Photo ${i}" loading="lazy" onerror="this.src='images/IMG_${i}.JPG'">
                <div class="item-overlay"><span>View Full Screen</span></div>
            `;

            galleryGrid.appendChild(itemDiv);
        }

        // Filter images by category
        function filterGallery(category) {
            currentCategory = category;

            // Update active state on filter buttons
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Reset all grid items to hidden
            const items = document.querySelectorAll('.gallery-item');
            items.forEach(item => item.style.display = 'none');

            // Show first batch for chosen category
            showNextBatch();
        }

        // Pagination: Reveal next batch of images
        function showNextBatch() {
            const items = Array.from(document.querySelectorAll('.gallery-item'));
            let revealed = 0;

            for (let item of items) {
                const isMatch = (currentCategory === 'all' || item.classList.contains(currentCategory));
                if (isMatch && item.style.display === 'none') {
                    item.style.display = 'block';
                    revealed++;
                    if (revealed >= itemsPerPage) break;
                }
            }

            // Hide or show "Discover More" button depending on remaining items
            const hiddenMatches = items.filter(item => 
                (currentCategory === 'all' || item.classList.contains(currentCategory)) && item.style.display === 'none'
            );
            
            const loadMoreBtn = document.getElementById('loadMoreBtn');
            if (loadMoreBtn) {
                loadMoreBtn.style.display = hiddenMatches.length > 0 ? 'inline-block' : 'none';
            }
        }

        // Lightbox Functions
        function openLightbox(src) {
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            
            lightbox.style.display = 'flex';
            lightboxImg.src = src;

            // Fallback for uppercase .JPG in lightbox
            lightboxImg.onerror = function() {
                if (this.src.endsWith('.jpg')) {
                    this.src = this.src.replace(/\.jpg$/, '.JPG');
                } else if (this.src.endsWith('.JPG')) {
                    this.src = this.src.replace(/\.JPG$/, '.jpg');
                }
            };
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        // Initialize gallery display on page load
        showNextBatch();
    </script>
</body>
</html>
